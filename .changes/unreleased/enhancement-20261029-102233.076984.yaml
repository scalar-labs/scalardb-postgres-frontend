kind: enhancement
body: 'First release of the ScalarDB PostgreSQL frontend, a PostgreSQL-compatible SQL interface for ScalarDB. PostgreSQL clients and tools, such as psql, the PostgreSQL JDBC driver and ORMs, connect over the PostgreSQL wire protocol, and their SQL runs on the databases ScalarDB manages, as ScalarDB transactions: each statement outside `BEGIN` is one transaction, and `BEGIN ... COMMIT` is one transaction. It runs inside ScalarDB Cluster nodes (the recommended deployment) or as a standalone server on ScalarDB core. The engine is published to Maven Central as `com.scalar-labs:scalardb-postgres-frontend-engine`, which ScalarDB Cluster embeds. See `docs/user/README.md`, and `LIMITATIONS.md` for what the frontend refuses or does differently from PostgreSQL.'
