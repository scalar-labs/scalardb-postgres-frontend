kind: bugfix
body: 'The server now turns on TCP keepalive for client connections, as PostgreSQL does. A client whose host went down or whose network was cut no longer leaves its session, and any transaction that session holds, open indefinitely: the operating system closes the connection once keepalive probes go unanswered (after about two hours with the default system settings).'
