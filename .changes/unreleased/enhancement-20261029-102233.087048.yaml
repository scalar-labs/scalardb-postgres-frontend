kind: enhancement
body: 'SQL as PostgreSQL 16 answers it: queries with joins, subqueries, aggregates, window functions, set operations and CTEs; `INSERT`, `UPDATE`, `DELETE` and `INSERT ... ON CONFLICT` with `RETURNING`, also inside `WITH`; and table, index and schema DDL. Each query runs as far as possible in ScalarDB, and `EXPLAIN` shows how. See `docs/user/sql-reference.md`.'
