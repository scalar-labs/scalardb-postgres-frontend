kind: improvement
body: 'Fewer reads in transactions: when a statement reads rows that an earlier statement in the same transaction already read, such as a `SELECT` followed by an `UPDATE ... SET x = x + 1` of the same row, ScalarDB reuses the earlier read instead of reading PostgreSQL again. In TPC-C this removes about 17% of the statements sent to PostgreSQL. `EXPLAIN` now lists every column of a table in `projections=[...]`, since every column is read.'
