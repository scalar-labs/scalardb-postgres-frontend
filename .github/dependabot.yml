# Weekly updates. The Docker base image is pinned by digest, so without this it never moves; the
# Gradle entry covers libs.versions.toml, where ScalarDB's own version is pinned by hand.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: com.scalar-labs:*
      # kept at ScalarDB's versions (see libs.versions.toml); slf4j stays on 1.7 for slf4j-simple
      - dependency-name: com.fasterxml.jackson.core:*
      - dependency-name: org.slf4j:*
      # 2.x lays code out differently: move with ScalarDB Saga, reformatting in one commit
      - dependency-name: com.google.googlejavaformat:google-java-format
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /server/src/docker
    schedule:
      interval: weekly
    ignore:
      # the image stays on an LTS JDK (25); moving to the next one is a decision, not an update
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    # the workflows, and the composite actions they call (push-server-image pins its own actions)
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
