# A standalone ScalarDB Cluster node with authentication, encryption (keys in a Vault dev server) and
# ABAC on, on a PostgreSQL at 15450 (database clustersec). See README.md.
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:postgresql://localhost:15450/clustersec
scalar.db.username=postgres
scalar.db.password=
scalar.db.transaction_manager=consensus-commit
scalar.db.cross_partition_scan.enabled=true
scalar.db.cross_partition_scan.filtering.enabled=true
scalar.db.cross_partition_scan.ordering.enabled=true
scalar.db.cluster.node.standalone_mode.enabled=true
scalar.db.cluster.node.prometheus_exporter_port=-1
scalar.db.cluster.auth.enabled=true
scalar.db.cluster.encryption.enabled=true
scalar.db.cluster.encryption.type=vault
scalar.db.cluster.encryption.vault.address=http://localhost:8200
scalar.db.cluster.encryption.vault.token=root
scalar.db.cluster.abac.enabled=true
# The node caches table metadata too: as short as the frontend's (1 s), or a read after ALTER TABLE
# on an existing table uses the old columns
scalar.db.metadata.cache_expiration_time_secs=1
