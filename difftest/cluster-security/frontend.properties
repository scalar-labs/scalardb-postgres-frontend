# The frontend as a Cluster client that logs PostgreSQL clients in as Cluster users.
scalar.db.transaction_manager=cluster
scalar.db.contact_points=indirect:localhost
scalar.db.contact_port=60053
scalar.db.postgres.auth=userpass
scalar.db.postgres.ssl.cert=../../engine/src/test/resources/tls/server.crt
scalar.db.postgres.ssl.key=../../engine/src/test/resources/tls/server.key
scalar.db.cluster.auth.enabled=true
# The frontend waits this long after DDL on an existing table, so it must match the node's setting
scalar.db.metadata.cache_expiration_time_secs=1
