# The frontend under ScalarDB's ICU collation, on a backing PostgreSQL whose text columns backend.sql
# alters to the matching nondeterministic ICU collation
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:postgresql://localhost:15440/sdbicu
scalar.db.username=postgres
scalar.db.password=
scalar.db.transaction_manager=consensus-commit
scalar.db.cross_partition_scan.enabled=true
scalar.db.cross_partition_scan.filtering.enabled=true
scalar.db.cross_partition_scan.ordering.enabled=true
scalar.db.collation=ICU
# secondary strength: case-insensitive, accent-sensitive
scalar.db.collation.icu.locale=und-u-ks-level2
# DDL on an existing table is answered once ScalarDB's table metadata cache has expired, so the next
# statement sees it; ScalarDB's default of 60 s would leave it unseen for a minute instead
scalar.db.metadata.cache_expiration_time_secs=1
