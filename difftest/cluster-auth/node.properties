# A standalone ScalarDB Cluster node on the difftest PostgreSQL, with authentication on.
# Run from a Cluster checkout: ./gradlew :node:installDist, then
#   node/build/install/scalardb-cluster-node/bin/scalardb-cluster-node --config <this file>
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:postgresql://localhost:15440/clusterdb
scalar.db.username=postgres
scalar.db.password=
scalar.db.transaction_manager=consensus-commit
scalar.db.cross_partition_scan.enabled=true
scalar.db.cross_partition_scan.filtering.enabled=true
scalar.db.cross_partition_scan.ordering.enabled=true
scalar.db.cluster.node.standalone_mode.enabled=true
scalar.db.cluster.node.port=60053
scalar.db.cluster.node.prometheus_exporter_port=-1
scalar.db.cluster.auth.enabled=true
