[versions]
# A released ScalarDB from Maven Central; a version branch that tracks an unreleased line takes
# ScalarDB's snapshot, or a checkout's ./gradlew :core:publishToMavenLocal
scalardb = "3.20.0"
# The Cluster client SDK, for the standalone server only: Cluster releases after the engine it embeds,
# so this stays a snapshot until then while the engine moves to a released ScalarDB
scalardb-cluster = "3.20.0-SNAPSHOT"
jsqlparser = "5.4"
# Runtime libraries ScalarDB itself also uses; kept at ScalarDB's versions
jackson = "2.22.3"
slf4j = "1.7.36"
# Newer than ScalarDB's 2.9.3, for the standalone server only: Caffeine 2 uses sun.misc.Unsafe, which
# Java 24 and later warn about and a later release removes. ScalarDB stays on 2 for its Java 8 target
caffeine = "3.3.0"
# Newer than ScalarDB's, for the shipped jar and image only: fixes for HIGH and CRITICAL CVEs in jars
# ScalarDB's storage drivers and the Cluster SDK bring in (drop each once ScalarDB catches up)
bouncycastle = "1.86"
micrometer = "1.15.12"
mssql-jdbc = "12.8.2.jre11"
postgresql = "42.7.13"
junit = "5.14.4"
assertj = "3.27.7"
mockito = "5.24.0"
# Build tools, at ScalarDB Saga's versions
spotless = "8.9.0"
google-java-format = "1.35.0"
spotbugs-plugin = "6.5.10"
spotbugs-annotations = "4.10.3"
findsecbugs = "1.14.0"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
nullaway = "0.13.8"
nullaway-plugin = "3.1.0"
jspecify = "1.0.1"
jcip = "1.0-1"
shadow = "9.6.1"
maven-publish-plugin = "0.37.0"

[libraries]
scalardb = { module = "com.scalar-labs:scalardb", version.ref = "scalardb" }
# The Cluster client SDK, for logging clients in as Cluster users; compiled against, not bundled
scalardb-cluster-client = { module = "com.scalar-labs:scalardb-cluster-java-client-sdk", version.ref = "scalardb-cluster" }
jsqlparser = { module = "com.github.jsqlparser:jsqlparser", version.ref = "jsqlparser" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql-jdbc" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs-annotations" }
findsecbugs-plugin = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
jcip-annotations = { module = "com.github.stephenc.jcip:jcip-annotations", version.ref = "jcip" }
# Consumed only as a version (spotless's googleJavaFormat(...) takes a version string); the entry
# exists so Dependabot can map the version to a module and bump it
google-java-format = { module = "com.google.googlejavaformat:google-java-format", version.ref = "google-java-format" }

# Gradle plugins the convention plugins apply: libraries on build-logic's classpath
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-plugin" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
nullaway-gradle-plugin = { module = "net.ltgt.gradle:gradle-nullaway-plugin", version.ref = "nullaway-plugin" }
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
maven-publish-gradle-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "maven-publish-plugin" }
